services:
  - type: web
    name: homy
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build && npm run db:push && npm run seed
    startCommand: npm run start --workspace=@homy/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: homy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: HØmy Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: homy-db
    plan: basic-256mb
    databaseName: homy
    user: homy