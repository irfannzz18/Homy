services:
  - type: web
    name: homy
    runtime: node
    plan: starter
    buildCommand: node scripts/prepare.js && npm install --include=dev && npm run build:all
    startCommand: npm run db:push && npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: homy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: HØmy Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VITE_API_URL
        value: /api
      - key: GOOGLE_MAPS_API_KEY
        sync: false

databases:
  - name: homy-db
    databaseName: homy
    user: homy
    plan: basic-256mb
